services:
  mysql:
    image: mysql:8.0
    container_name: smartfridge-mysql
    environment:
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/mysql_root_password
      MYSQL_DATABASE: smartfridge
      MYSQL_USER: smartfridge
      MYSQL_PASSWORD_FILE: /run/secrets/mysql_user_password
      TZ: Asia/Taipei
    ports:
      - "3306:3306"
    volumes:
      - mysql:/var/lib/mysql
      # 依檔名排序自動執行：先建結構，再灌測試資料
      # 正式上線時，把 02-seed.sql 這行註解／刪掉，就是一個乾淨的空庫
      - ./env/mysql/01-schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./env/mysql/02-seed.sql:/docker-entrypoint-initdb.d/02-seed.sql
    secrets:
      - mysql_root_password
      - mysql_user_password

  flask:
    build:
      context: .
      dockerfile: ./env/flask/Dockerfile
    container_name: smartfridge-flask
    environment:
      FLASK_ENV: development
      FLASK_APP: app:create_app
      APP_ENV: development
      MYSQL_HOST: mysql
      MYSQL_DATABASE: smartfridge
      MYSQL_USER: smartfridge
      MYSQL_PASSWORD_FILE: /run/secrets/mysql_user_password
      DB_CONNECT_RETRY_ATTEMPTS: 6
      DB_CONNECT_RETRY_DELAY_SECONDS: 0.35
      SECRET_KEY_FILE: /run/secrets/flask_secret_key
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      TZ: Asia/Taipei
    volumes:
      - ./app:/app
    depends_on:
      - mysql
    ports:
      - "5000:5000"
    secrets:
      - mysql_user_password
      - flask_secret_key

  nginx:
    image: nginx:1.27-alpine
    container_name: smartfridge-nginx
    depends_on:
      - flask
    ports:
      - "80:80"
    volumes:
      - ../../dist:/usr/share/nginx/html:ro
      - ./env/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  mysql:

secrets:
  mysql_root_password:
    file: ./secrets/mysql_root_password.txt
  mysql_user_password:
    file: ./secrets/mysql_user_password.txt
  flask_secret_key:
    file: ./secrets/flask_secret_key.txt
